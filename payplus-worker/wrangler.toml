name = "tomchei-torah-payplus"
main = "worker.js"
compatibility_date = "2024-09-01"

[vars]
# "dev" = סביבת בדיקות של PayPlus (בלי חיוב אמיתי). להחליף ל-"prod" כשמוכנים.
PAYPLUS_ENV = "dev"
SITE_URL = "https://www.tomcheitorah.com"
ALLOWED_ORIGINS = "https://www.tomcheitorah.com,https://tomcheitorah.com"
# מזהה דף התשלום (Payment Page UID) מהפאנל של PayPlus
PAYPLUS_PAGE_UID = ""

# המפתחות הסודיים לא נכתבים כאן! מגדירים אותם ב-Cloudflare כ-Secrets:
#   PAYPLUS_API_KEY
#   PAYPLUS_SECRET_KEY
